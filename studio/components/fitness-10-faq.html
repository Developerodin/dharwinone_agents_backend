<style>.c-fitness-10{--dim:color-mix(in srgb, var(--ink) 58%, var(--bg) 42%);--accent-deep:color-mix(in srgb, var(--accent), var(--bg) 25%);--accent-tint:color-mix(in srgb, var(--accent) 14%, var(--bg));--on-accent:color-mix(in srgb, var(--bg), var(--ink) 4%);} .c-fitness-10{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);font-size:1.03rem;line-height:1.6;} .c-fitness-10 p{max-width:66ch;} .c-fitness-10 .eyebrow{font-family:'Oswald',sans-serif;font-size:.8rem;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:600;} .c-fitness-10 details{border-bottom:1px solid var(--line);padding:1.05rem 0;} .c-fitness-10 details summary{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-weight:600;font-size:1.02rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;color:var(--ink);} .c-fitness-10 details summary::after{content:"+";color:var(--accent);font-size:1.4rem;font-family:'Inter',sans-serif;} .c-fitness-10 details[open] summary::after{content:"–";} .c-fitness-10 details p{color:var(--dim);margin:.65rem 0 0;font-size:.95rem;} .c-fitness-10 .sec-title{font-size:clamp(2rem,3.6vw,2.9rem);color:var(--ink);} .c-fitness-10 .faq{padding:5.5rem 0;background:var(--soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line);} .c-fitness-10 .faq details{border-bottom:1px solid var(--line);} .c-fitness-10 .faq summary{cursor:pointer;padding:1rem 0;font-weight:600;font-size:1.1rem;list-style:none;} .c-fitness-10 .faq summary::-webkit-details-marker{display:none;} .c-fitness-10 .faq details p{font-size:.95rem;padding-bottom:1rem;margin:0;color:var(--muted,var(--dim,var(--ink-65)));}</style>
