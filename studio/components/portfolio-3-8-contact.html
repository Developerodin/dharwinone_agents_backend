<style>.c-portfolio-3-8{--ink-55:color-mix(in oklab, var(--ink) 55%, var(--bg));} .c-portfolio-3-8{background:var(--bg);color:var(--ink);font-family:"Sora",sans-serif;font-weight:300;font-size:1.0625rem;line-height:1.7} .c-portfolio-3-8 h1, .c-portfolio-3-8 h2, .c-portfolio-3-8 h3{font-family:"Sora",sans-serif;font-weight:200;color:var(--ink);letter-spacing:-.01em} .c-portfolio-3-8 p{max-width:60ch} .c-portfolio-3-8 a{color:var(--accent)} .c-portfolio-3-8 .cap{font-size:.75rem;letter-spacing:.32em;text-transform:uppercase;color:var(--ink-55);font-weight:400} .c-portfolio-3-8 .btn-bone{background:transparent;color:var(--ink);border:1px solid var(--accent);border-radius:0;padding:.75rem 2rem;font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;font-weight:400} .c-portfolio-3-8 .btn-bone:hover{background:var(--accent);color:var(--bg)} .c-portfolio-3-8 .contact{padding:7rem 0;text-align:center} .c-portfolio-3-8 .contact h2{font-size:clamp(2.2rem,6vw,4.6rem)} .c-portfolio-3-8 .contact .mail{font-size:clamp(1rem,2.4vw,1.35rem);letter-spacing:.06em;color:var(--ink);text-decoration:underline;text-underline-offset:.4em} .c-portfolio-3-8 .contact .mail:hover{color:var(--accent)} .c-portfolio-3-8 .contact .avail{color:var(--ink-55);font-size:.8rem;letter-spacing:.26em;text-transform:uppercase;margin-top:2.25rem} .c-portfolio-3-8 footer a{color:var(--ink-55);text-decoration:none;margin-left:1.5rem;text-transform:uppercase;font-size:.75rem;letter-spacing:.2em} .c-portfolio-3-8 footer a:hover{color:var(--ink)} @media (prefers-reduced-motion: no-preference){.c-portfolio-3-8 a, .c-portfolio-3-8 .btn-bone, .c-portfolio-3-8 .nav-gal a.link{transition:all .25s ease}.c-portfolio-3-8 .work img{transition:transform 1s ease, opacity 1s ease}.c-portfolio-3-8 .work figure:hover img{transform:scale(1.03)}.c-portfolio-3-8 .show-row .t{transition:color .25s ease}}</style>
