<style>.c-shop-2-2{--ink-65:color-mix(in oklab, var(--ink) 65%, var(--bg));--ink-45:color-mix(in oklab, var(--ink) 45%, var(--bg));} .c-shop-2-2{background:var(--bg);color:var(--ink);font-family:"Mulish",sans-serif;font-size:1.0625rem;line-height:1.7} .c-shop-2-2 p{max-width:64ch} .c-shop-2-2 a{color:var(--accent)} .c-shop-2-2 .folio{font-size:.75rem;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:700} .c-shop-2-2 .btn-ox{background:var(--accent);color:var(--bg);border:1px solid var(--accent);border-radius:0;padding:.7rem 1.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.82rem} .c-shop-2-2 .btn-ox:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)} .c-shop-2-2 .btn-rule{background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:0;padding:.7rem 1.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.82rem} .c-shop-2-2 .btn-rule:hover{background:var(--ink);color:var(--bg)} .c-shop-2-2 .hero{padding:4.5rem 0 3.5rem;border-bottom:1px solid var(--line)} .c-shop-2-2 .hero h1{font-size:clamp(3rem,8vw,6.4rem);line-height:1.03;letter-spacing:-.01em} .c-shop-2-2 .hero h1 i{color:var(--accent)} .c-shop-2-2 .hero .tagline{font-family:"Libre Caslon Text",serif;font-style:italic;color:var(--ink-65);font-size:1.25rem;max-width:44ch} .c-shop-2-2 .hero .dek{color:var(--ink-65);font-size:.95rem;letter-spacing:.14em;text-transform:uppercase} .c-shop-2-2 .atelier .folio{color:color-mix(in oklab, var(--accent) 55%, var(--bg))} .c-shop-2-2 footer a{color:var(--ink-65);text-decoration:none;display:block;padding:.2rem 0;font-size:.95rem} .c-shop-2-2 footer a:hover{color:var(--accent)} @media (prefers-reduced-motion: no-preference){.c-shop-2-2 a, .c-shop-2-2 .btn-ox, .c-shop-2-2 .btn-rule{transition:all .22s ease}.c-shop-2-2 .collage img, .c-shop-2-2 .spread .plate img{transition:transform .7s ease}.c-shop-2-2 .collage .cell:hover img{transform:scale(1.035)}.c-shop-2-2
