<style>.c-cafe-3-2{--ink-65:color-mix(in oklab, var(--ink) 65%, var(--bg));--sage-tint:color-mix(in oklab, var(--accent) 10%, var(--bg));--butter:color-mix(in oklab, #e9c46a 22%, var(--bg));} .c-cafe-3-2{background:var(--bg);color:var(--ink);font-family:"Nunito Sans",sans-serif;font-size:1.0625rem;line-height:1.7} .c-cafe-3-2 h1, .c-cafe-3-2 h2, .c-cafe-3-2 h3{font-family:"Outfit",sans-serif;font-weight:600;letter-spacing:-.015em;color:var(--ink)} .c-cafe-3-2 p{max-width:62ch} .c-cafe-3-2 a{color:var(--accent)} .c-cafe-3-2 .tag{display:inline-block;background:var(--sage-tint);color:var(--accent);border-radius:999px;padding:.35rem 1rem;font-size:.85rem;font-weight:700} .c-cafe-3-2 .btn-sage{background:var(--accent);color:var(--bg);border:none;border-radius:999px;padding:.7rem 1.6rem;font-weight:700;font-family:"Outfit",sans-serif} .c-cafe-3-2 .btn-sage:hover{background:color-mix(in oklab, var(--accent) 80%, var(--ink));color:var(--bg)} .c-cafe-3-2 .btn-soft{background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.7rem 1.6rem;font-weight:700;font-family:"Outfit",sans-serif} .c-cafe-3-2 .btn-soft:hover{border-color:var(--accent);color:var(--accent)} .c-cafe-3-2 .hero{padding:5rem 0 4rem} .c-cafe-3-2 .hero h1{font-size:clamp(2.9rem,6.5vw,4.8rem);line-height:1.06} .c-cafe-3-2 .hero .tagline{color:var(--ink-65);font-size:1.2rem;max-width:42ch} .c-cafe-3-2 .hero-img{border-radius:2.5rem;overflow:hidden;aspect-ratio:4/5} .c-cafe-3-2 .hero-img img{width:100%;height:100%;object-fit:cover;display:block} .c-cafe-3-2 .hero-chip{background:var(--bg);border:1px solid var(--line);border-radius:1.5rem;padding:1rem 1.3rem;box-shadow:0 14px 34px rgba(51,61,54,.1);max-width:16rem} .c-cafe-3-2 .hero-chip b{font-family:"Outfit",sans-serif} .c-cafe-3-2 .hero-chip .time{color:var(--accent);font-weight:700;font-size:.9rem} .c-cafe-3-2 footer a{color:var(--ink-65);text-decoration:none;display:block;padding:.2rem 0;font-size:.95rem} .c-cafe-3-2 footer a:hover{color:var(--accent)} @media (prefers-reduced-motion: no-preference){.c-cafe-3-2 .btn-sage, .c-cafe-3-2 .btn-soft, .c-cafe-3-2 footer a, .c-cafe-3-2 .nav-air a.link{transition:all .22s ease}.c-cafe-3-2 .bake-card{transition:transform .3s ease, box-shadow .3s ease}.c-cafe-3-2 .bake-card:hover{transform:translateY(-6px);box-shadow:0 20px 44px rgba(51,61,54,.12)}.c-cafe-3-2 .hero-img img, .c-cafe-3-2 .table-band img{transition:transform .6s ease}.c-cafe-3-2 .hero-img:hover img, .c-cafe-3-2 .table-band .photo:hover img{transform:scale(1.04)}}</style>
<header class="c-cafe-3-2 hero">
  <div class="container">
    <div class="row align-items-center g-5">
      <div class="col-lg-6">
        <span class="tag mb-3">Bakery and daylight cafe</span>
        <h1 class="mt-3">Soft light, warm crumb, no rush at all.</h1>
        <p class="tagline mt-4">{{TAGLINE}}</p>
        <div class="d-flex gap-3 mt-4 flex-wrap">
          <a class="btn-sage btn" href="#bakes">See today's bake</a>
          <a class="btn-soft btn" href="#visit">Hours and address</a>
        </div>
      </div>
      <div class="col-lg-6 position-relative">
        <div class="hero-img"><img src="https://images.unsplash.com/photo-1517093602195-b40af9688b46?w=900&q=60" alt="Sunlit bakery counter with fresh bread and pastries"></div>
        <div class="hero-chip position-absolute bottom-0 start-0 ms-lg-n3 mb-4 ms-3">
          <b>Cinnamon buns</b><br><span class="time">Next tray out at 9:40</span>
        </div>
      </div>
    </div>
  </div>
</header>
