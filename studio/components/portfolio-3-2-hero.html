<style>.c-portfolio-3-2{--ink-55:color-mix(in oklab, var(--ink) 55%, var(--bg));} .c-portfolio-3-2{background:var(--bg);color:var(--ink);font-family:"Sora",sans-serif;font-weight:300;font-size:1.0625rem;line-height:1.7} .c-portfolio-3-2 h1, .c-portfolio-3-2 h2, .c-portfolio-3-2 h3{font-family:"Sora",sans-serif;font-weight:200;color:var(--ink);letter-spacing:-.01em} .c-portfolio-3-2 p{max-width:60ch} .c-portfolio-3-2 .cap{font-size:.75rem;letter-spacing:.32em;text-transform:uppercase;color:var(--ink-55);font-weight:400} .c-portfolio-3-2 .hero{padding:7.5rem 0 5rem} .c-portfolio-3-2 .hero h1{font-size:clamp(2.6rem,7vw,5.6rem);line-height:1.08} .c-portfolio-3-2 .hero .tagline{color:var(--ink-55);font-size:1.1rem;max-width:44ch;margin-top:1.75rem} .c-portfolio-3-2 .hero .scroll-cue{margin-top:4rem;font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:var(--ink-55)}</style>
