<style>.c-shop-2-7{--ink-65:color-mix(in oklab, var(--ink) 65%, var(--bg));--ink-45:color-mix(in oklab, var(--ink) 45%, var(--bg));} .c-shop-2-7{background:var(--bg);color:var(--ink);font-family:"Mulish",sans-serif;font-size:1.0625rem;line-height:1.7} .c-shop-2-7 p{max-width:64ch} .c-shop-2-7 a{color:var(--accent)} .c-shop-2-7 .folio{font-size:.75rem;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:700} .c-shop-2-7 .btn-ox{background:var(--accent);color:var(--bg);border:1px solid var(--accent);border-radius:0;padding:.7rem 1.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.82rem} .c-shop-2-7 .btn-ox:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)} .c-shop-2-7 .atelier{padding:6rem 0;background:var(--ink);color:var(--bg)} .c-shop-2-7 .atelier h2{color:var(--bg);font-size:clamp(2.2rem,5vw,3.8rem)} .c-shop-2-7 .atelier p{color:color-mix(in oklab, var(--bg) 72%, var(--ink))} .c-shop-2-7 .atelier .folio{color:color-mix(in oklab, var(--accent) 55%, var(--bg))} .c-shop-2-7 footer a{color:var(--ink-65);text-decoration:none;display:block;padding:.2rem 0;font-size:.95rem} .c-shop-2-7 footer a:hover{color:var(--accent)} @media (prefers-reduced-motion: no-preference){.c-shop-2-7 a, .c-shop-2-7 .btn-ox, .c-shop-2-7 .btn-rule{transition:all .22s ease}.c-shop-2-7 .collage img, .c-shop-2-7 .spread .plate img{transition:transform .7s ease}.c-shop-2-7 .collage .cell:hover img{transform:scale(1.035)}.c-shop-2-7 .piece{transition:padding-left .25s ease}.c-shop-2-7 .piece:hover{padding-left:.75rem}}</style>
