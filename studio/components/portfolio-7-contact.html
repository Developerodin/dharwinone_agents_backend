<style>.c-portfolio-7{--dim:color-mix(in srgb, var(--ink) 55%, var(--bg) 45%);--dim-2:color-mix(in srgb, var(--ink) 38%, var(--bg) 62%);--accent-soft:color-mix(in srgb, var(--accent) 18%, var(--bg));} .c-portfolio-7{font-family:'Karla',sans-serif;background:var(--bg);color:var(--ink);font-size:1.05rem;line-height:1.65;} .c-portfolio-7 p{max-width:66ch;} .c-portfolio-7 a{color:var(--ink);} .c-portfolio-7 .eyebrow{font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;} .c-portfolio-7 .dim{color:var(--dim);} .c-portfolio-7 .contact{padding:7rem 0;background:var(--accent-soft);border-top:1px solid var(--line);} .c-portfolio-7 .contact h2{font-size:clamp(2.4rem,5vw,4rem);font-weight:300;font-style:italic;} .c-portfolio-7 .mail{font-family:'Fraunces',serif;font-size:clamp(1.3rem,3vw,2rem);color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:.15rem;} .c-portfolio-7 .mail:hover{color:var(--ink);border-color:var(--ink);} .c-portfolio-7 footer a{color:var(--dim);text-decoration:none;} .c-portfolio-7 footer a:hover{color:var(--accent);}</style>
<section data-section="contact" id="contact" class="c-portfolio-7 contact">
