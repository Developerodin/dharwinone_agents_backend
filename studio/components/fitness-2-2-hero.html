<style>.c-fitness-2-2{--dim:color-mix(in srgb, var(--ink) 55%, var(--bg) 45%);--on-accent:#16090a;} .c-fitness-2-2{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--ink);font-size:1.0625rem;line-height:1.6;} .c-fitness-2-2 p{max-width:62ch;} .c-fitness-2-2 a{color:var(--accent);} .c-fitness-2-2 .muted{color:var(--muted);} .c-fitness-2-2 .btn-main{background:var(--accent);color:var(--on-accent);border:2px solid var(--accent);padding:.85rem 2rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.92rem;display:inline-block;text-decoration:none;} .c-fitness-2-2 .btn-main:hover{background:color-mix(in srgb, var(--accent) 80%, var(--ink) 20%);border-color:color-mix(in srgb, var(--accent) 80%, var(--ink) 20%);color:var(--on-accent);} .c-fitness-2-2 .btn-quiet{background:transparent;color:var(--ink);border:2px solid var(--line);padding:.85rem 2rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.92rem;display:inline-block;text-decoration:none;} .c-fitness-2-2 .btn-quiet:hover{border-color:var(--ink);color:var(--ink);} .c-fitness-2-2 .hero{position:relative;padding:6.5rem 0 7rem;border-bottom:1px solid var(--line);overflow:hidden;} .c-fitness-2-2 .hero h1{font-size:clamp(3.4rem,10vw,8.2rem);line-height:.94;color:var(--ink);} .c-fitness-2-2 .hero h1 span{color:var(--accent);} .c-fitness-2-2 .hero .tagline{color:var(--muted);font-size:1.22rem;max-width:46ch;} .c-fitness-2-2 .hero img{width:100%;height:100%;min-height:340px;object-fit:cover;border:1px solid var(--line);filter:saturate(.85) contrast(1.08);} .c-fitness-2-2 .hero .openline{font-family:'Anton',sans-serif;text-transform:uppercase;color:var(--dim);font-size:.95rem;letter-spacing:.28em;margin-bottom:1.2rem;} @media (prefers-reduced-motion: no-preference){.c-fitness-2-2 .hourrow, .c-fitness-2-2 .plan, .c-fitness-2-2 .btn-main, .c-fitness-2-2 .btn-quiet{transition:background-color .18s ease, border-color .18s ease, color .18s ease;}.c-fitness-2-2 .hourrow:hove
