<style>.c-travel-3-10{--ink-70:color-mix(in oklab, var(--ink) 70%, var(--bg));--ink-50:color-mix(in oklab, var(--ink) 50%, var(--bg));--sand-on-ink:color-mix(in oklab, var(--bg) 92%, var(--ink));} .c-travel-3-10{background:var(--bg);color:var(--ink);font-family:"Karla",sans-serif;font-size:1.0625rem;line-height:1.75} .c-travel-3-10 h1, .c-travel-3-10 h2, .c-travel-3-10 h3{font-family:"Cormorant Garamond",serif;font-weight:500;color:var(--ink);letter-spacing:.005em} .c-travel-3-10 p{max-width:62ch} .c-travel-3-10 .whisper{font-size:.74rem;letter-spacing:.34em;text-transform:uppercase;color:var(--accent);font-weight:600} .c-travel-3-10 .hero .whisper{color:color-mix(in oklab, var(--bg) 88%, var(--accent))} .c-travel-3-10 .reserve{padding:6.5rem 0;background:var(--ink)} .c-travel-3-10 .reserve .whisper{color:color-mix(in oklab, var(--accent) 55%, var(--sand-on-ink))} .c-travel-3-10 .reserve h2{color:var(--sand-on-ink);font-size:clamp(2.2rem,5vw,3.8rem);max-width:22ch} .c-travel-3-10 .reserve p{color:color-mix(in oklab, var(--sand-on-ink) 80%, var(--ink))} .c-travel-3-10 .reserve .btn-sand{background:var(--sand-on-ink);color:var(--ink);border:1px solid var(--sand-on-ink);border-radius:0;padding:.8rem 2.4rem;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600} .c-travel-3-10 .reserve .btn-sand:hover{background:transparent;color:var(--sand-on-ink)} .c-travel-3-10 .reserve .line{display:flex;justify-content:space-between;gap:1rem;border-top:1px solid color-mix(in oklab, var(--sand-on-ink) 24%, var(--ink));padding:.9rem 0;font-size:.92rem;color:color-mix(in oklab, var(--sand-on-ink) 82%, var(--ink))} .c-travel-3-10 .reserve .line b{color:var(--sand-on-ink);font-weight:600} .c-travel-3-10 footer a{color:var(--ink-70);text-decoration:none;display:block;padding:.2rem 0} .c-travel-3-10 footer a:hover{color:var(--accent)}</style>
