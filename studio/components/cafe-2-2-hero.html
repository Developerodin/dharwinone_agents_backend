<style>.c-cafe-2-2{--ink-70:color-mix(in oklab, var(--ink) 72%, var(--bg));--ink-50:color-mix(in oklab, var(--ink) 52%, var(--bg));--glow:color-mix(in oklab, var(--accent) 14%, var(--bg));} .c-cafe-2-2{background:var(--bg);color:var(--ink);font-family:"Manrope",sans-serif;font-size:1.0625rem;line-height:1.7} .c-cafe-2-2 h1, .c-cafe-2-2 h2, .c-cafe-2-2 h3{font-family:"Cormorant Garamond",serif;color:var(--ink);font-weight:500} .c-cafe-2-2 p{max-width:64ch} .c-cafe-2-2 a{color:var(--accent)} .c-cafe-2-2 .kicker{font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);font-weight:700} .c-cafe-2-2 .hero{padding:7rem 0 5.5rem;text-align:center;background:radial-gradient(ellipse 70% 55% at 50% 0%, var(--glow), var(--bg) 75%)} .c-cafe-2-2 .hero h1{font-size:clamp(3.4rem,9vw,7rem);line-height:1.02;letter-spacing:.01em} .c-cafe-2-2 .hero h1 em{font-style:italic;color:var(--accent)} .c-cafe-2-2 .hero .tagline{color:var(--ink-70);font-size:1.2rem;max-width:46ch;margin:1.75rem auto 0} .c-cafe-2-2 .hero .hours-line{color:var(--ink-50);font-size:.9rem;letter-spacing:.22em;text-transform:uppercase;margin-top:2.5rem} .c-cafe-2-2 .btn-amber{background:var(--accent);color:var(--bg);border:1px solid var(--accent);border-radius:0;padding:.8rem 2.2rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.85rem} .c-cafe-2-2 .btn-amber:hover{background:transparent;color:var(--accent)} .c-cafe-2-2 .btn-line{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:0;padding:.8rem 2.2rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.85rem} .c-cafe-2-2 .btn-line:hover{border-color:var(--ink);color:var(--ink)} .c-cafe-2-2 footer a{color:var(--ink-70);text-decoration:none;display:block;padding:.18rem 0;font-size:.92rem} .c-cafe-2-2 footer a:hover{color:var(--accent)} @media (prefers-reduced-motion: no-preference){.c-cafe-2-2 .btn-amber, .c-cafe-2-2 .btn-line, .c-cafe-2-2 .nav-noir .open-pill, .c-cafe-2-2 footer a, .c-cafe-2-2 .nav-noir a.link{transition:all .25s ease}.c-cafe-2-2 .band img{transition:transform .8s ease, filter .8s ease}.c-cafe-2-2 .band figure:hover img{transform:scale(1.04);filter:saturate(1) contrast(1.05)}.c-cafe-2-2 .pour{transition:padding-left .25s ease}.c-cafe-2-2 .pour:hover{padding-left:.5rem}}</style>
