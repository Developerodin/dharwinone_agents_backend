<style>.c-construction-2{background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,sans-serif;font-size:1.0625rem;line-height:1.6;} .c-construction-2 .display-face{font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.01em;line-height:.95;text-transform:uppercase;} .c-construction-2 .kicker{font-family:"Barlow Condensed",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.22em;font-size:.85rem;color:var(--accent);} .c-construction-2 p{max-width:68ch;} .c-construction-2 a{color:var(--accent);} .c-construction-2 .btn-site{background:var(--accent);color:var(--soft);border:1px solid var(--accent);font-family:"Barlow Condensed",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.12em;padding:.6rem 1.5rem;border-radius:0;} .c-construction-2 .btn-site:hover{background:var(--ink);border-color:var(--ink);color:var(--soft);} .c-construction-2 .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);font-family:"Barlow Condensed",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.12em;padding:.6rem 1.5rem;border-radius:0;} .c-construction-2 .btn-ghost:hover{background:var(--ink);color:var(--soft);} .c-construction-2 .hero{padding:5.5rem 0 4.5rem;} .c-construction-2 .hero h1{font-size:clamp(3.4rem,8vw,6.2rem);color:var(--ink);} .c-construction-2 .hero h1 .site-accent{color:var(--accent);} .c-construction-2 .hero .tagline{font-size:1.3rem;color:rgba(38,35,28,.78);max-width:34rem;} .c-construction-2 .hero-meta{border-top:1px solid var(--line);padding-top:1.25rem;font-size:.92rem;} .c-construction-2 .hero-meta strong{font-family:"Barlow Condensed",sans-serif;font-size:1.15rem;letter-spacing:.05em;text-transform:uppercase;display:block;} .c-construction-2 .hero-photo{position:relative;overflow:hidden;min-height:26rem;} .c-construction-2 .hero-photo img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;} .c-construction-2 .hero-photo .plate{position:absolute;left:0;bottom:0;background:var(--ink);color:var(--soft);padding:.7rem 1.2rem;font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:.85rem;z-index:2;} @media (prefers-reduced-motion: no-preference){.c-construction-2 .strip-track{animation:crawl 34s linear infinite;}@keyframes c-construction-2-crawl{from{transform:translateX(0)}to{transform:translateX(-50%)}}.c-construction-2 .lift{transition:transform .25s ease,box-shadow .25s ease;}.c-construction-2 .lift:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(38,35,28,.14);}.c-construction-2 .zoom img{transition:transform .6s ease;}.c-construction-2 .zoom:hover img{transform:scale(1.05);}} .c-construction-2 footer a{color:rgba(233,229,219,.82);text-decoration:none;} .c-construction-2 footer a:hover{color:var(--soft);}</style>
<header data-section="hero" class="c-construction-2 hero">
  <div class="container">
    <div class="row g-5 align-items-center">
      <div class="col-lg-6">
        <p class="kicker mb-3">Civil contracting, turnkey delivery</p>
        <h1 class="display-face mb-3">Built to drawing.<br>Handed over <span class="site-accent">on date.</span></h1>
        <p class="tagline mt-3">{{TAGLINE}}</p>
        <div class="d-flex flex-wrap gap-3 mt-4 mb-5">
          <a class="btn btn-site" href="#contact">Get a BOQ estimate</a>
          <a class="btn btn-ghost" href="#projects">See live sites</a>
        </div>
        <div class="row hero-meta g-3">
          <div class="col-4"><strong>RERA registered</strong>Promoter and agent compliant</div>
          <div class="col-4"><strong>1.2M sq ft</strong>Delivered across 34 projects</div>
          <div class="col-4"><strong>Zero LTI</strong>Last 640 days on active sites</div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="hero-photo lift zoom">
          <img src="https://images.unsplash.com/photo-1541888946425-d81bb19240f5?w=1200&q=60" alt="Active construction site with crew at work">
          <span class="plate">Site 12, Tower B, structure at L14</span>
        </div>
      </div>
    </div>
  </div>
</header>
