<style>.c-education-3-2{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.0625rem;line-height:1.6;} .c-education-3-2 h1, .c-education-3-2 h2, .c-education-3-2 h3, .c-education-3-2 h4{font-weight:800;letter-spacing:-.02em;} .c-education-3-2 .kick{font-weight:700;font-size:.82rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);} .c-education-3-2 p{max-width:64ch;} .c-education-3-2 a{color:var(--accent);} .c-education-3-2 .btn-vio{background:var(--accent);color:#fff;border:2px solid var(--accent);font-weight:700;padding:.6rem 1.5rem;border-radius:.75rem;} .c-education-3-2 .btn-vio:hover{background:var(--ink);border-color:var(--ink);color:#fff;} .c-education-3-2 .btn-ghosty{background:var(--soft);color:var(--ink);border:2px solid var(--line);font-weight:700;padding:.6rem 1.5rem;border-radius:.75rem;} .c-education-3-2 .btn-ghosty:hover{border-color:var(--accent);color:var(--accent);background:var(--soft);} .c-education-3-2 .hero{padding:5.5rem 0 4.5rem;} .c-education-3-2 .hero h1{font-size:clamp(2.8rem,7vw,5.4rem);line-height:.98;} .c-education-3-2 .hero h1 .box{background:var(--accent);color:#fff;padding:0 .25em;border-radius:.75rem;display:inline-block;} .c-education-3-2 .hero .tagline{font-size:1.3rem;color:color-mix(in srgb, var(--ink) 76%, var(--bg));max-width:35rem;} .c-education-3-2 .cohort-strip{display:inline-flex;flex-wrap:wrap;gap:.6rem 1.6rem;background:var(--soft);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.4rem;font-size:.95rem;margin-top:1.9rem;} .c-education-3-2 .cohort-strip b{font-weight:800;color:var(--accent);} .c-education-3-2 .hero-img{border-radius:1.5rem;overflow:hidden;border:1px solid var(--line);} .c-education-3-2 .hero-img img{width:100%;height:26rem;object-fit:cover;display:block;} .c-education-3-2 .hero-chip{background:var(--ink);color:#fff;border-radius:1rem;padding:1rem 1.3rem;margin-top:-2.4rem;margin-left:1.25rem;position:relative;display:inline-b
