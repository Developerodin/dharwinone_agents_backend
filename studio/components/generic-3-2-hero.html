<style>.c-generic-3-2{--paper-80:color-mix(in oklab, var(--soft) 82%, var(--bg));--ink-70:color-mix(in oklab, var(--ink) 70%, var(--soft));--bg-deep:color-mix(in oklab, var(--bg) 82%, var(--ink));} .c-generic-3-2{background:var(--bg);color:var(--ink);font-family:"Archivo",sans-serif;font-size:1.0625rem;line-height:1.6} .c-generic-3-2 h1, .c-generic-3-2 h2, .c-generic-3-2 h3{font-family:"Archivo",sans-serif;font-weight:800;letter-spacing:-.03em;color:var(--ink)} .c-generic-3-2 p{max-width:62ch} .c-generic-3-2 .tab{font-size:.76rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase} .c-generic-3-2 .btn-signal{background:var(--accent);color:var(--ink);border:none;border-radius:0;padding:.7rem 1.7rem;font-weight:800;font-size:.92rem;text-transform:uppercase;letter-spacing:.04em} .c-generic-3-2 .btn-signal:hover{background:var(--soft);color:var(--ink)} .c-generic-3-2 .btn-hollow{background:transparent;color:var(--soft);border:2px solid var(--soft);border-radius:0;padding:.62rem 1.7rem;font-weight:800;font-size:.92rem;text-transform:uppercase;letter-spacing:.04em} .c-generic-3-2 .btn-hollow:hover{background:var(--soft);color:var(--bg)} .c-generic-3-2 .hero{background:var(--bg);padding:5.5rem 0 6rem;color:var(--soft)} .c-generic-3-2 .hero .tab{color:var(--accent)} .c-generic-3-2 .hero h1{color:var(--soft);font-weight:900;font-size:clamp(3rem,9vw,6.8rem);line-height:.96;text-transform:uppercase;max-width:12ch} .c-generic-3-2 .hero .tagline{color:var(--paper-80);font-size:1.25rem;max-width:42ch} .c-generic-3-2 .hero .fact-row{border-top:2px solid var(--paper-80);margin-top:3rem;padding-top:1.3rem;display:flex;gap:2.5rem;flex-wrap:wrap} .c-generic-3-2 .hero .fact-row div b{display:block;font-size:1.7rem;font-weight:900;color:var(--accent);line-height:1.1} .c-generic-3-2 .hero .fact-row div span{font-size:.85rem;color:var(--paper-80)} .c-generic-3-2 .offer .cell .tab{color:var(--bg)} @media (prefers-reduced-motion: no-preference){.c-generic-3-2 .offer .cell{transition:transform .2s ease,box-shadow .2s ease}.c-generic-3-2 .offer .cell:hover{transform:translate(-4px,-4px);box-shadow:6px 6px 0 var(--ink)}.c-generic-3-2 .btn-signal, .c-generic-3-2 .btn-hollow{transition:background .2s ease,color .2s ease}.c-generic-3-2 .photo-block img{transition:transform .6s ease}.c-generic-3-2 .photo-block:hover img{transform:scale(1.05)}.c-generic-3-2 .step-block .n{transition:transform .3s ease}.c-generic-3-2 .step-block:hover .n{transform:translateX(.6rem)}} .c-generic-3-2 footer a{color:var(--paper-80);text-decoration:none;display:block;padding:.2rem 0;font-size:.95rem} .c-generic-3-2 footer a:hover{color:var(--accent)}</style>
