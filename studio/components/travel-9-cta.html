<style>.c-travel-9{--ink-70:color-mix(in oklab, var(--ink) 70%, var(--bg));--ink-45:color-mix(in oklab, var(--ink) 45%, var(--bg));--mist-on-ink:color-mix(in oklab, var(--bg) 88%, var(--ink));} .c-travel-9{background:var(--bg);color:var(--ink);font-family:"Instrument Sans",sans-serif;font-size:1.0625rem;line-height:1.65} .c-travel-9 h1, .c-travel-9 h2, .c-travel-9 h3{font-family:"Bricolage Grotesque",sans-serif;color:var(--ink);letter-spacing:-.02em} .c-travel-9 p{max-width:66ch} .c-travel-9 .btn-amber{background:var(--accent);color:var(--bg);border:none;border-radius:999px;padding:.6rem 1.5rem;font-weight:600} .c-travel-9 .btn-amber:hover{background:color-mix(in oklab, var(--accent) 80%, var(--ink));color:var(--bg)} .c-travel-9 .hero .bgimg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1800&q=60') center/cover no-repeat} .c-travel-9 .hero .veil{position:absolute;inset:0;background:linear-gradient(180deg, rgba(20,40,46,.35) 0%, rgba(20,40,46,.15) 40%, rgba(20,40,46,.78) 100%)} .c-travel-9 .hero .content{position:relative;z-index:2;padding:7rem 0 4.5rem;width:100%} .c-travel-9 details p{color:var(--ink-70);margin:.7rem 0 0;font-size:.98rem} .c-travel-9 .cta{padding:6rem 0;position:relative;overflow:hidden} .c-travel-9 .cta .bgimg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600&q=60') center/cover no-repeat} .c-travel-9 .cta .veil{position:absolute;inset:0;background:rgba(20,40,46,.72)} .c-travel-9 .cta .content{position:relative;z-index:2;text-align:center} .c-travel-9 .cta h2{color:var(--mist-on-ink);font-size:clamp(2.2rem,5vw,3.8rem);font-weight:800} .c-travel-9 .cta p{color:rgba(237,240,233,.85);margin-left:auto;margin-right:auto} .c-travel-9 footer a{color:rgba(237,240,233,.78);text-decoration:none;display:block;padding:.2rem 0;font-size:.95rem} .c-travel-9 footer a:hover{color:var(--accent)}</style>
