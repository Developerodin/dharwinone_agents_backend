<style>.c-education-3-5{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.0625rem;line-height:1.6;} .c-education-3-5 h1, .c-education-3-5 h2, .c-education-3-5 h3, .c-education-3-5 h4{font-weight:800;letter-spacing:-.02em;} .c-education-3-5 .kick{font-weight:700;font-size:.82rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);} .c-education-3-5 p{max-width:64ch;} .c-education-3-5 .curriculum .kick{color:#c9b6f2;} .c-education-3-5 .outcomes{padding:5rem 0;} .c-education-3-5 .out-card{border:1px solid var(--line);border-radius:1.25rem;padding:1.7rem 1.6rem;height:100%;background:var(--bg);} .c-education-3-5 .out-card b{display:block;font-size:2.1rem;font-weight:800;color:var(--accent);letter-spacing:-.02em;line-height:1.1;} .c-education-3-5 .out-card span{font-size:.95rem;color:color-mix(in srgb, var(--ink) 76%, var(--bg));} .c-education-3-5 .mentor-quote{background:var(--soft);border:1px solid var(--line);border-radius:1.5rem;padding:2.2rem 2rem;} .c-education-3-5 .mentor-quote blockquote{font-weight:600;font-size:1.35rem;line-height:1.45;letter-spacing:-.01em;} .c-education-3-5 .mentor-quote figcaption{font-size:.92rem;color:color-mix(in srgb, var(--ink) 72%, var(--bg));font-weight:600;} @media (prefers-reduced-motion: no-preference){.c-education-3-5 .mod .lessons{transition:grid-template-rows .35s ease;}.c-education-3-5 .mod{transition:border-color .25s ease;}.c-education-3-5 .track, .c-education-3-5 .out-card{transition:transform .25s ease,box-shadow .25s ease;}.c-education-3-5 .track:hover, .c-education-3-5 .out-card:hover{transform:translateY(-5px);box-shadow:0 18px 38px rgba(29,23,48,.12);}.c-education-3-5 .hero-img img{transition:transform .55s ease;}.c-education-3-5 .hero-img:hover img{transform:scale(1.04);}.c-education-3-5 .btn-vio, .c-education-3-5 .btn-ghosty, .c-education-3-5 .btn-white{transition:background-color .2s ease,color .2s ease,border-color .2s ease;}}</style>
