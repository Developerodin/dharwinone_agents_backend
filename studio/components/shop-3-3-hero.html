<style>.c-shop-3-3{--ink-60:color-mix(in oklab, var(--ink) 62%, var(--bg));--stamp:color-mix(in oklab, var(--accent) 10%, var(--bg));} .c-shop-3-3{background:var(--bg);color:var(--ink);font-family:"Inter",sans-serif;font-size:1.0625rem;line-height:1.6} .c-shop-3-3 h1, .c-shop-3-3 h2, .c-shop-3-3 h3{font-family:"Inter",sans-serif;font-weight:800;letter-spacing:-.02em;color:var(--ink)} .c-shop-3-3 p{max-width:64ch} .c-shop-3-3 a{color:var(--accent)} .c-shop-3-3 .label{font-family:"IBM Plex Mono",monospace;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600} .c-shop-3-3 .num{font-variant-numeric:tabular-nums} .c-shop-3-3 .btn-safety{background:var(--accent);color:#fff;border:2px solid var(--accent);border-radius:0;padding:.6rem 1.4rem;font-weight:700;font-family:"IBM Plex Mono",monospace;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase} .c-shop-3-3 .btn-safety:hover{background:var(--ink);border-color:var(--ink);color:#fff} .c-shop-3-3 .btn-plain{background:transparent;color:var(--ink);border:2px solid var(--ink);border-radius:0;padding:.6rem 1.4rem;font-weight:700;font-family:"IBM Plex Mono",monospace;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase} .c-shop-3-3 .btn-plain:hover{background:var(--ink);color:var(--bg)} .c-shop-3-3 .hero{padding:4.5rem 0;border-bottom:1px solid var(--line)} .c-shop-3-3 .hero h1{font-size:clamp(2.7rem,7vw,5.2rem);line-height:1;text-transform:uppercase} .c-shop-3-3 .hero h1 .hl{color:var(--accent)} .c-shop-3-3 .hero .tagline{color:var(--ink-60);font-size:1.15rem;max-width:46ch} .c-shop-3-3 .hero-photo{border:1px solid var(--line);background:var(--soft)} .c-shop-3-3 .hero-photo img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block} .c-shop-3-3 .hero-photo .plate{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:.55rem .8rem;border-top:1px solid var(--line);color:var(--ink-60)} .c-shop-3-3 .spec-strip{display:flex;flex-wrap:wrap;gap:2.25rem;margin-top:2.5rem} .c-shop-3-3 .spec-strip .cell b{display:block;font-family:"IBM Plex Mono",monospace;font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums} .c-shop-3-3 .spec-strip .cell span{font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-60)} .c-shop-3-3 .field blockquote .hl{background:var(--stamp);color:var(--accent);padding:0 .3rem} .c-shop-3-3 .order .label{color:#ff9a5c} .c-shop-3-3 footer a{color:var(--ink-60);text-decoration:none;display:block;padding:.2rem 0;font-size:.92rem} .c-shop-3-3 footer a:hover{color:var(--accent)} @media (prefers-reduced-motion: no-preference){.c-shop-3-3 a, .c-shop-3-3 .btn-safety, .c-shop-3-3 .btn-plain, .c-shop-3-3 .item .add{transition:all .18s ease}.c-shop-3-3 .item{transition:background .18s ease}.c-shop-3-3 .item:hover{background:var(--stamp)}}</style>
