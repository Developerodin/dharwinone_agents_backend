<style>.c-medical-2-2{background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-size:1.0625rem;line-height:1.65;} .c-medical-2-2 h1, .c-medical-2-2 h2, .c-medical-2-2 h3, .c-medical-2-2 h4{font-weight:800;letter-spacing:-.01em;} .c-medical-2-2 .eyebrow{font-weight:800;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);} .c-medical-2-2 p{max-width:64ch;} .c-medical-2-2 a{color:var(--accent);} .c-medical-2-2 .btn-plum{background:var(--accent);color:#fff;border:2px solid var(--accent);font-weight:800;padding:.6rem 1.5rem;border-radius:2rem;} .c-medical-2-2 .btn-plum:hover{background:var(--ink);border-color:var(--ink);color:#fff;} .c-medical-2-2 .btn-sand{background:color-mix(in srgb, var(--line) 55%, var(--soft));color:var(--ink);border:2px solid var(--line);font-weight:800;padding:.6rem 1.5rem;border-radius:2rem;} .c-medical-2-2 .btn-sand:hover{background:var(--ink);border-color:var(--ink);color:#fff;} .c-medical-2-2 .hero{padding:5rem 0 4.5rem;} .c-medical-2-2 .hero h1{font-size:clamp(2.5rem,6vw,4.2rem);line-height:1.1;} .c-medical-2-2 .hero h1 .hl{color:var(--accent);} .c-medical-2-2 .hero .tagline{font-size:1.25rem;color:color-mix(in srgb, var(--ink) 78%, var(--bg));max-width:33rem;} .c-medical-2-2 .hours-pill{display:inline-flex;flex-wrap:wrap;gap:.5rem 1.5rem;background:var(--soft);border:1px solid var(--line);border-radius:1.25rem;padding:1rem 1.4rem;font-size:.95rem;margin-top:1.8rem;} .c-medical-2-2 .hours-pill b{font-weight:800;} .c-medical-2-2 .hero-photo{border-radius:2rem;overflow:hidden;box-shadow:0 22px 55px rgba(64,49,63,.16);} .c-medical-2-2 .hero-photo img{width:100%;height:27rem;object-fit:cover;display:block;} .c-medical-2-2 footer a{color:color-mix(in srgb, var(--bg) 84%, var(--ink));text-decoration:none;} .c-medical-2-2 footer a:hover{color:var(--bg);} @media (prefers-reduced-motion: no-preference){.c-medical-2-2 .stage, .c-medical-2-2 .doc, .c-medical-2-2 .v-card{transition:transform .25s ease,box-shadow .25s ease;}.c-medical-2-2 .stage:hover, .c-medical-2-2 .v-card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(64,49,63,.12);}.c-medical-2-2 .doc img{transition:transform .55s ease;}.c-medical-2-2 .doc:hover img{transform:scale(1.05);}.c-medical-2-2 .btn-plum, .c-medical-2-2 .btn-sand, .c-medical-2-2 .btn-cream{transition:background-color .2s ease,color .2s ease,border-color .2s ease;}} @media (max-width:575px){.c-medical-2-2 .hero-photo img{height:18rem;}}</style>
<header class="c-medical-2-2 hero">
  <div class="container">
    <div class="row g-5 align-items-center">
