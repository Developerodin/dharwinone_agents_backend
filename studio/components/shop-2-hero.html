<style>.c-shop-2{--ink-70:color-mix(in oklab, var(--ink) 70%, var(--bg));--ink-45:color-mix(in oklab, var(--ink) 45%, var(--bg));--paper-on-ink:color-mix(in oklab, var(--bg) 90%, var(--ink));--accent-soft:color-mix(in oklab, var(--accent) 12%, var(--bg));} .c-shop-2{background:var(--bg);color:var(--ink);font-family:"Archivo",sans-serif;font-size:1.0625rem;line-height:1.6} .c-shop-2 h1, .c-shop-2 h2, .c-shop-2 h3{font-family:"Space Grotesk",sans-serif;color:var(--ink);letter-spacing:-.02em} .c-shop-2 p{max-width:65ch} .c-shop-2 .eyebrow{font-family:"Space Grotesk",sans-serif;font-size:.78rem;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700} .c-shop-2 .btn-cobalt{background:var(--accent);color:var(--bg);border:2px solid var(--accent);border-radius:.35rem;padding:.6rem 1.4rem;font-weight:700;font-family:"Space Grotesk",sans-serif} .c-shop-2 .btn-cobalt:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)} .c-shop-2 .btn-ghost{background:transparent;color:var(--ink);border:2px solid var(--ink);border-radius:.35rem;padding:.6rem 1.4rem;font-weight:700;font-family:"Space Grotesk",sans-serif} .c-shop-2 .btn-ghost:hover{background:var(--ink);color:var(--bg)} .c-shop-2 .hero{padding:5rem 0 4rem;position:relative;overflow:hidden} .c-shop-2 .hero h1{font-size:clamp(3.4rem,8vw,6.2rem);font-weight:700;line-height:.98;text-transform:uppercase} .c-shop-2 .hero h1 .hollow{color:transparent;-webkit-text-stroke:2px var(--ink)} .c-shop-2 .hero .tagline{color:var(--ink-70);font-size:1.15rem;max-width:42ch} .c-shop-2 .hero-shot{background:var(--soft);border:2px solid var(--ink);border-radius:1rem;overflow:hidden;position:relative} .c-shop-2 .hero-shot img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block} .c-shop-2 .sticker{position:absolute;top:1.2rem;right:1.2rem;background:var(--accent);color:var(--bg);font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;padding:.
