<style>.c-portfolio-2{--dim:color-mix(in srgb, var(--ink) 55%, var(--bg) 45%);--dim-2:color-mix(in srgb, var(--ink) 38%, var(--bg) 62%);--accent-soft:color-mix(in srgb, var(--accent) 18%, var(--bg));} .c-portfolio-2{font-family:'Karla',sans-serif;background:var(--bg);color:var(--ink);font-size:1.05rem;line-height:1.65;} .c-portfolio-2 p{max-width:66ch;} .c-portfolio-2 .eyebrow{font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;} .c-portfolio-2 .hero{padding:7rem 0 5.5rem;} .c-portfolio-2 .hero .bigname{font-family:'Fraunces',serif;font-weight:300;font-style:italic;font-size:clamp(4rem,13vw,10.5rem);line-height:.95;letter-spacing:-.03em;color:var(--ink);} .c-portfolio-2 .hero .headline{font-size:clamp(1.5rem,2.6vw,2.1rem);font-weight:500;max-width:26ch;line-height:1.3;} .c-portfolio-2 .hero .tagline{color:var(--dim);font-size:1.05rem;max-width:48ch;} .c-portfolio-2 .hero .meta{color:var(--dim-2);font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;} .c-portfolio-2 .rule{height:1px;background:var(--line);border:none;opacity:1;}</style>
<header data-section="hero" class="c-portfolio-2 hero">
  <div class="container">
    <p class="eyebrow mb-3">Photographer · Lisbon &amp; wherever the light is</p>
    <h1 class="bigname">{{BRAND}}</h1>
    <hr class="rule my-4">
    <div class="row g-4 align-items-start">
      <div class="col-lg-6">
        <p class="headline mb-0">Quiet places, working hands, and the hour before anyone else is awake.</p>
      </div>
      <div class="col-lg-4 offset-lg-1">
        <p class="tagline">{{TAGLINE}}</p>
        <p class="meta mb-0">Medium format film · Editorial · Prints</p>
      </div>
    </div>
  </div>
</header>
