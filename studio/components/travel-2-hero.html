<style>.c-travel-2{--ink-70:color-mix(in oklab, var(--ink) 70%, var(--bg));--ink-45:color-mix(in oklab, var(--ink) 45%, var(--bg));--mist-on-ink:color-mix(in oklab, var(--bg) 88%, var(--ink));} .c-travel-2{background:var(--bg);color:var(--ink);font-family:"Instrument Sans",sans-serif;font-size:1.0625rem;line-height:1.65} .c-travel-2 h1, .c-travel-2 h2, .c-travel-2 h3{font-family:"Bricolage Grotesque",sans-serif;color:var(--ink);letter-spacing:-.02em} .c-travel-2 p{max-width:66ch} .c-travel-2 .eyebrow{font-size:.78rem;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:600} .c-travel-2 .btn-amber{background:var(--accent);color:var(--bg);border:none;border-radius:999px;padding:.6rem 1.5rem;font-weight:600} .c-travel-2 .btn-amber:hover{background:color-mix(in oklab, var(--accent) 80%, var(--ink));color:var(--bg)} .c-travel-2 .hero{position:relative;min-height:92vh;display:flex;align-items:flex-end;overflow:hidden} .c-travel-2 .hero .bgimg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1800&q=60') center/cover no-repeat} .c-travel-2 .hero .veil{position:absolute;inset:0;background:linear-gradient(180deg, rgba(20,40,46,.35) 0%, rgba(20,40,46,.15) 40%, rgba(20,40,46,.78) 100%)} .c-travel-2 .hero .content{position:relative;z-index:2;padding:7rem 0 4.5rem;width:100%} .c-travel-2 .hero h1{color:var(--mist-on-ink);font-size:clamp(3.4rem,8vw,6.4rem);font-weight:800;line-height:1;max-width:14ch} .c-travel-2 .hero h1 em{font-style:italic;color:var(--accent)} .c-travel-2 .hero .tagline{color:rgba(237,240,233,.85);font-size:1.2rem;max-width:46ch} .c-travel-2 .hero .strip{border-top:1px solid rgba(237,240,233,.28);margin-top:2.5rem;padding-top:1.2rem;display:flex;gap:2rem;flex-wrap:wrap;color:rgba(237,240,233,.8);font-size:.92rem} .c-travel-2 .hero .strip b{color:var(--mist-on-ink);font-family:"Bricolage Grotesque",sans-serif} .c-travel-2 details p{color:var(--ink-70);margin:.7rem 0 0;font-size:.98rem} .c-travel-2 .cta .bgimg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600&q=60') center/cover no-repeat} .c-travel-2 .cta .veil{position:absolute;inset:0;background:rgba(20,40,46,.72)} .c-travel-2 .cta .content{position:relative;z-index:2;text-align:center} .c-travel-2 footer a{color:rgba(237,240,233,.78);text-decoration:none;display:block;padding:.2rem 0;font-size:.95rem} .c-travel-2 footer a:hover{color:var(--accent)}</style>
<header class="c-travel-2 hero">
  <div class="bgimg" role="img" aria-label="Sunrise over a mountain valley"></div>
  <div class="veil"></div>
  <div class="content">
    <div class="container">
      <p class="eyebrow mb-3">{{BRAND}} small group expeditions, 12 travelers max</p>
      <h1>Go where the <em>map creases.</em></h1>
      <p class="tagline mt-4">{{TAGLINE}}</p>
      <div class="d-flex gap-3 mt-4 flex-wrap">
        <a class="btn-amber btn" href="#itinerary">See a real itinerary</a>
      </div>
      <div class="strip">
        <span><b>23</b> routes across 6 continents</span>
        <span><b>Local guides</b> on every departure</span>
        <span><b>No hidden fees</b>, the quote is the price</span>
      </div>
    </div>
  </div>
</header>
