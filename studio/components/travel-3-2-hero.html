<style>.c-travel-3-2{--ink-70:color-mix(in oklab, var(--ink) 70%, var(--bg));--ink-50:color-mix(in oklab, var(--ink) 50%, var(--bg));--sand-on-ink:color-mix(in oklab, var(--bg) 92%, var(--ink));} .c-travel-3-2{background:var(--bg);color:var(--ink);font-family:"Karla",sans-serif;font-size:1.0625rem;line-height:1.75} .c-travel-3-2 h1, .c-travel-3-2 h2, .c-travel-3-2 h3{font-family:"Cormorant Garamond",serif;font-weight:500;color:var(--ink);letter-spacing:.005em} .c-travel-3-2 p{max-width:62ch} .c-travel-3-2 .whisper{font-size:.74rem;letter-spacing:.34em;text-transform:uppercase;color:var(--accent);font-weight:600} .c-travel-3-2 .btn-tide{background:var(--accent);color:var(--sand-on-ink);border:1px solid var(--accent);border-radius:0;padding:.75rem 2.2rem;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600} .c-travel-3-2 .btn-tide:hover{background:var(--ink);border-color:var(--ink);color:var(--sand-on-ink)} .c-travel-3-2 .hero{position:relative;min-height:88vh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden} .c-travel-3-2 .hero .bgimg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1439066615861-d1af74d74000?w=1800&q=60') center/cover no-repeat} .c-travel-3-2 .hero .veil{position:absolute;inset:0;background:rgba(22,51,47,.44)} .c-travel-3-2 .hero .content{position:relative;z-index:2;padding:5rem 1.5rem} .c-travel-3-2 .hero .whisper{color:color-mix(in oklab, var(--bg) 88%, var(--accent))} .c-travel-3-2 .hero h1{color:var(--sand-on-ink);font-size:clamp(3rem,7.5vw,5.8rem);font-weight:500;line-height:1.06;max-width:16ch;margin:1.2rem auto 0} .c-travel-3-2 .hero h1 em{font-style:italic} .c-travel-3-2 .hero .tagline{color:color-mix(in oklab, var(--sand-on-ink) 88%, var(--ink));font-size:1.15rem;max-width:44ch;margin:1.6rem auto 0} @media (prefers-reduced-motion: no-preference){.c-travel-3-2 .suite{transition:box-shadow .35s ease,transform .35s ease}.c-travel-3-2 .suite:hover{box-shadow:0 22px 50px rgba(22,51,47,.14);transform:translateY(-4px)}.c-travel-3-2 .drift img{transition:transform .8s ease}.c-travel-3-2 .drift:hover img{transform:scale(1.045)}.c-travel-3-2 .btn-tide, .c-travel-3-2 .btn-shell{transition:background .25s ease,color .25s ease,border-color .25s ease}} .c-travel-3-2 .reserve .whisper{color:color-mix(in oklab, var(--accent) 55%, var(--sand-on-ink))} .c-travel-3-2 footer a{color:var(--ink-70);text-decoration:none;display:block;padding:.2rem 0} .c-travel-3-2 footer a:hover{color:var(--accent)}</style>
<header data-section="hero" class="c-travel-3-2 hero" id="top">
  <div class="bgimg" role="img" aria-label="Still lake at dusk with mountains fading into mist"></div>
  <div class="veil"></div>
  <div class="content">
    <p class="whisper">A quiet shore, forty minutes from the airstrip</p>
    <h1>Arrive with plans. <em>Lose them by morning.</em></h1>
    <p class="tagline">{{TAGLINE}}</p>
    <div class="d-flex gap-3 justify-content-center mt-4 flex-wrap">
      <a class="btn btn-tide" href="#suites">View the suites</a>
    </div>
  </div>
</header>
