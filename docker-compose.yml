services:
  postgres:
    image: postgres:16
    container_name: dharwin-postgres
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: dharwin_studio
    ports:
      - "5432:5432"
    volumes:
      - dharwin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d dharwin_studio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dharwin_pgdata:
