<style>.c-education-2-2{background:var(--bg);color:var(--ink);font-family:"EB Garamond",Georgia,serif;font-size:1.125rem;line-height:1.65;} .c-education-2-2 h1, .c-education-2-2 h2, .c-education-2-2 h3, .c-education-2-2 h4{font-family:"EB Garamond",serif;font-weight:600;letter-spacing:.005em;} .c-education-2-2 .sc{font-variant:small-caps;letter-spacing:.22em;font-weight:600;font-size:1rem;color:var(--accent);} .c-education-2-2 p{max-width:62ch;} .c-education-2-2 a{color:var(--accent);} .c-education-2-2 .btn-oxford{background:var(--ink);color:var(--bg);border:1px solid var(--ink);font-family:"Public Sans",sans-serif;font-weight:700;font-size:.9rem;letter-spacing:.04em;padding:.65rem 1.6rem;border-radius:0;} .c-education-2-2 .btn-oxford:hover{background:var(--accent);border-color:var(--accent);color:#fff;} .c-education-2-2 .btn-plain{background:transparent;color:var(--ink);border:1px solid var(--ink);font-family:"Public Sans",sans-serif;font-weight:700;font-size:.9rem;letter-spacing:.04em;padding:.65rem 1.6rem;border-radius:0;} .c-education-2-2 .btn-plain:hover{background:var(--ink);color:var(--bg);} .c-education-2-2 .hero{padding:5.5rem 0 4.5rem;text-align:center;} .c-education-2-2 .hero .sc{display:block;margin-bottom:1rem;} .c-education-2-2 .hero h1{font-size:clamp(2.8rem,7vw,5.2rem);line-height:1.05;max-width:20ch;margin:0 auto .75rem;} .c-education-2-2 .hero h1 em{font-style:italic;color:var(--accent);} .c-education-2-2 .hero .tagline{font-size:1.35rem;font-style:italic;color:color-mix(in srgb, var(--ink) 76%, var(--bg));max-width:44rem;margin:0 auto;} .c-education-2-2 .hero-orn{display:flex;align-items:center;gap:1rem;justify-content:center;margin:1.75rem 0;color:var(--accent);} .c-education-2-2 .hero-orn::before, .c-education-2-2 .hero-orn::after{content:"";height:1px;width:6rem;background:var(--line);} .c-education-2-2 .hero-photo{margin-top:3rem;border:1px solid var(--line);padding:.6rem;background:var(--soft);} .c-education-2-2 .hero-photo img{width:100%;height:26rem;object-fit:cover;display:block;} .c-education-2-2 .hero-photo figcaption{font-style:italic;font-size:1rem;padding:.8rem .4rem .2rem;color:color-mix(in srgb, var(--ink) 72%, var(--bg));} .c-education-2-2 .school .sc{font-size:.88rem;} .c-education-2-2 .cta .sc{color:color-mix(in srgb, var(--accent) 60%, #fff);} .c-education-2-2 footer a{color:var(--ink);text-decoration:none;} .c-education-2-2 footer a:hover{color:var(--accent);} @media (prefers-reduced-motion: no-preference){.c-education-2-2 .school, .c-education-2-2 .life-photo{transition:transform .25s ease,box-shadow .25s ease;}.c-education-2-2 .school:hover, .c-education-2-2 .life-photo:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(22,41,77,.12);}.c-education-2-2 .btn-oxford, .c-education-2-2 .btn-plain, .c-education-2-2 .btn-gold{transition:background-color .2s ease,color .2s ease,border-color .2s ease;}} @media (max-width:575px){.c-education-2-2 .hero-photo img{height:16rem;}}</style>
<header data-section="hero" class="c-education-2-2 hero">
  <div class="container">
    <span class="sc">A residential institute of the liberal arts and sciences</span>
    <h1>Read deeply. Argue well. <em>Leave better.</em></h1>
    <div class="hero-orn" aria-hidden="true">✦</div>
    <p class="tagline">{{TAGLINE}}</p>
    <div class="d-flex flex-wrap gap-3 justify-content-center mt-4">
      <a class="btn btn-oxford" href="#apply">Request the prospectus</a>
      <a class="btn btn-plain" href="#admissions">See the admissions calendar</a>
    </div>
    <figure class="hero-photo mb-0">
      <img src="https://images.unsplash.com/photo-1541339907198-e08756dedf3f?w=1400&q=60" alt="Stone facade and lawns of the main college building in morning light">
      <figcaption>The Founders' Building and east lawns, where convocation has been held every March since 1964.</figcaption>
    </figure>
  </div>
</header>
