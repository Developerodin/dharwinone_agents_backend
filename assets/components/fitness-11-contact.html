<style>.c-fitness-11{--dim:color-mix(in srgb, var(--ink) 58%, var(--bg) 42%);--accent-deep:color-mix(in srgb, var(--accent), var(--bg) 25%);--accent-tint:color-mix(in srgb, var(--accent) 14%, var(--bg));--on-accent:color-mix(in srgb, var(--bg), var(--ink) 4%);} .c-fitness-11{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);font-size:1.03rem;line-height:1.6;} .c-fitness-11 p{max-width:66ch;} .c-fitness-11 a{color:var(--accent);} .c-fitness-11 .eyebrow{font-family:'Oswald',sans-serif;font-size:.8rem;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:600;} .c-fitness-11 .dim{color:var(--dim);} .c-fitness-11 .coach .cred{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;color:var(--accent);margin-bottom:.5rem;} .c-fitness-11 details p{color:var(--dim);margin:.65rem 0 0;font-size:.95rem;} .c-fitness-11 footer a{color:var(--dim);text-decoration:none;} .c-fitness-11 footer a:hover{color:var(--accent);} .c-fitness-11 .sec-title{font-size:clamp(2rem,3.6vw,2.9rem);color:var(--ink);}</style>
