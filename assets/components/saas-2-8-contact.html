<style>.c-saas-2-8{--dim:color-mix(in srgb, var(--ink) 58%, var(--bg) 42%);--on-accent:#0b1310;--panel:color-mix(in srgb, var(--soft) 80%, var(--bg) 20%);} .c-saas-2-8{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);font-size:1.0625rem;line-height:1.65;} .c-saas-2-8 p{max-width:66ch;} .c-saas-2-8 a{color:var(--accent);} .c-saas-2-8 .eyebrow{font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);} .c-saas-2-8 .sec-title{font-size:clamp(1.7rem,3vw,2.4rem);font-weight:700;} .c-saas-2-8 details p{color:var(--muted);margin:.6rem 0 0;font-size:.95rem;} .c-saas-2-8 footer a{color:var(--dim);text-decoration:none;} .c-saas-2-8 footer a:hover{color:var(--ink);}</style>
