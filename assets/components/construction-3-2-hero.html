<style>.c-construction-3-2{background:var(--bg);color:var(--ink);font-family:"Quicksand",system-ui,sans-serif;font-size:1.0625rem;line-height:1.65;} .c-construction-3-2 h1, .c-construction-3-2 h2, .c-construction-3-2 h3{font-family:"Lora",Georgia,serif;font-weight:600;letter-spacing:-.01em;} .c-construction-3-2 .eyebrow{font-family:"Quicksand",sans-serif;font-weight:700;font-size:.82rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);} .c-construction-3-2 p{max-width:64ch;} .c-construction-3-2 a{color:var(--accent);} .c-construction-3-2 img{max-width:100%;} .c-construction-3-2 .btn-warm{background:var(--accent);color:var(--soft);border:1px solid var(--accent);font-weight:700;letter-spacing:.04em;padding:.65rem 1.6rem;border-radius:2rem;} .c-construction-3-2 .btn-warm:hover{background:var(--ink);border-color:var(--ink);color:var(--soft);} .c-construction-3-2 .btn-quiet{background:transparent;color:var(--ink);border:1.5px solid var(--ink);font-weight:700;letter-spacing:.04em;padding:.65rem 1.6rem;border-radius:2rem;} .c-construction-3-2 .btn-quiet:hover{background:var(--ink);color:var(--soft);} .c-construction-3-2 .hero{padding:5rem 0 4.5rem;} .c-construction-3-2 .hero h1{font-size:clamp(2.6rem,6.2vw,4.4rem);line-height:1.08;} .c-construction-3-2 .hero h1 em{font-style:italic;color:var(--accent);} .c-construction-3-2 .hero .tagline{font-size:1.28rem;color:color-mix(in srgb, var(--ink) 76%, var(--bg));max-width:33rem;} .c-construction-3-2 .hero-photo{border-radius:1.5rem;overflow:hidden;box-shadow:0 24px 60px rgba(58,45,34,.18);} .c-construction-3-2 .hero-photo img{width:100%;height:28rem;object-fit:cover;display:block;} .c-construction-3-2 .hero-badge{background:var(--soft);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.25rem;display:inline-flex;gap:1rem;align-items:center;margin-top:-2.6rem;position:relative;margin-left:1.25rem;box-shadow:0 12px 30px rgba(58,45,34,.12);} .c-construction-3-2 .hero-badge b{font-family:"Lora",serif;font-size:1.35rem;display:block;line-height:1.1;} .c-construction-3-2 .hero-badge span{font-size:.85rem;color:color-mix(in srgb, var(--ink) 70%, var(--bg));} .c-construction-3-2 footer a{color:color-mix(in srgb, var(--bg) 82%, var(--ink));text-decoration:none;} .c-construction-3-2 footer a:hover{color:var(--bg);} @media (prefers-reduced-motion: no-preference){.c-construction-3-2 .svc, .c-construction-3-2 .materials, .c-construction-3-2 .ba-photo{transition:transform .25s ease,box-shadow .25s ease;}.c-construction-3-2 .svc:hover{transform:translateY(-5px);box-shadow:0 18px 36px rgba(58,45,34,.14);}.c-construction-3-2 .ba-photo img{transition:transform .6s ease;}.c-construction-3-2 .ba-photo:hover img{transform:scale(1.05);}.c-construction-3-2 .btn-warm, .c-construction-3-2 .btn-quiet, .c-construction-3-2 .btn-cream{transition:background-color .2s ease,color .2s ease,border-color .2s ease;}} @media (max-width:575px){.c-construction-3-2 .hero-photo img{height:19rem;}.c-construction-3-2 .ba-photo img{height:15rem;}}</style>
<header data-section="hero" class="c-construction-3-2 hero">
  <div class="container">
    <div class="row g-5 align-items-center">
      <div class="col-lg-6">
        <p class="eyebrow mb-3">Interior renovation and bespoke carpentry</p>
        <h1 class="mb-3">Rooms that feel like <em>they were always yours.</em></h1>
        <p class="tagline mt-3">{{TAGLINE}}</p>
        <div class="d-flex flex-wrap gap-3 mt-4">

          <a class="btn btn-quiet" href="#transformations">See a transformation</a>

      </div>
      <div class="col-lg-6">

          <img src="https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=1200&q=60" alt="Warm living room with built-in walnut shelving and soft afternoon light">
        </div>
        <div class="hero-badge">

    </div>
  </div>
</header>
