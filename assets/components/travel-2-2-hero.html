<style>.c-travel-2-2{--ink-72:color-mix(in oklab, var(--ink) 72%, var(--bg));--ink-55:color-mix(in oklab, var(--ink) 55%, var(--bg));--paper-on-ink:color-mix(in oklab, var(--bg) 92%, var(--ink));} .c-travel-2-2{background:var(--bg);color:var(--ink);font-family:"Bitter",serif;font-size:1.0625rem;line-height:1.7} .c-travel-2-2 h1, .c-travel-2-2 h2, .c-travel-2-2 h3{font-family:"Bitter",serif;font-weight:800;letter-spacing:-.015em;color:var(--ink)} .c-travel-2-2 p{max-width:64ch} .c-travel-2-2 .stamp{font-family:"Space Mono",monospace;font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700} .c-travel-2-2 .btn-compass{background:var(--accent);color:var(--paper-on-ink);border:2px solid var(--accent);border-radius:0;padding:.5rem 1.3rem;font-family:"Space Mono",monospace;font-size:.85rem;font-weight:700;letter-spacing:.05em} .c-travel-2-2 .btn-compass:hover{background:var(--ink);border-color:var(--ink);color:var(--paper-on-ink)} .c-travel-2-2 .btn-pencil{background:transparent;color:var(--ink);border:2px solid var(--ink);border-radius:0;padding:.5rem 1.3rem;font-family:"Space Mono",monospace;font-size:.85rem;font-weight:700;letter-spacing:.05em} .c-travel-2-2 .btn-pencil:hover{background:var(--ink);color:var(--paper-on-ink)} .c-travel-2-2 .hero{padding:5rem 0 4.5rem;border-bottom:1px dashed var(--line)} .c-travel-2-2 .hero h1{font-size:clamp(2.8rem,6.5vw,5rem);line-height:1.04;max-width:15ch} .c-travel-2-2 .hero .tagline{font-size:1.2rem;color:var(--ink-72);max-width:44ch} .c-travel-2-2 .hero .margin-note{font-family:"Space Mono",monospace;font-size:.8rem;color:var(--ink-55);border-top:1px dashed var(--line);padding-top:1rem;margin-top:2.2rem;display:flex;gap:2rem;flex-wrap:wrap} .c-travel-2-2 .hero .margin-note b{color:var(--ink);font-weight:700} .c-travel-2-2 .photo-plate{background:var(--soft);border:1px solid var(--line);padding:.85rem .85rem 1rem;box-shadow:6px 6px 0 var(--line)} .c-travel-2-2 .photo-plate img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;filter:sepia(.12) contrast(1.02)} .c-travel-2-2 .photo-plate figcaption{font-family:"Space Mono",monospace;font-size:.74rem;color:var(--ink-55);margin-top:.7rem;letter-spacing:.04em} @media (prefers-reduced-motion: no-preference){.c-travel-2-2 .entry{transition:background .25s ease}.c-travel-2-2 .entry:hover{background:var(--soft)}.c-travel-2-2 .photo-plate, .c-travel-2-2 .plate-sm{transition:transform .3s ease,box-shadow .3s ease}.c-travel-2-2 .photo-plate:hover, .c-travel-2-2 .plate-sm:hover{transform:translateY(-5px) rotate(-.4deg);box-shadow:8px 10px 0 var(--line)}.c-travel-2-2 .btn-compass, .c-travel-2-2 .btn-pencil{transition:background .2s ease,color .2s ease,border-color .2s ease}} .c-travel-2-2 .cta .stamp{color:color-mix(in oklab, var(--accent) 65%, var(--paper-on-ink))} .c-travel-2-2 footer a{color:var(--ink-72);text-decoration:none;display:block;padding:.18rem 0} .c-travel-2-2 footer a:hover{color:var(--accent)}</style>
