[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dharwin-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pymongo",
    "pyyaml",
    "python-dotenv",
    "pyjwt",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
studio-api = "studio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["studio*", "harness*"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["studio"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
